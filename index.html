<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suvyora AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d0f17; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; }
    .chat-container { height: calc(100vh - 160px); }
    .glass { background: rgba(22, 27, 38, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- Header -->
  <header class="glass px-6 py-4 flex justify-between items-center z-10">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-white shadow-lg">S</div>
      <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400">Suvyora AI</h1>
    </div>
    <button onclick="openSettings()" class="text-gray-400 hover:text-white transition"><i class="fa-solid fa-gear text-lg"></i></button>
  </header>

  <!-- Chat Area -->
  <main id="chat-box" class="chat-container flex-1 overflow-y-auto p-4 md:p-6 space-y-4 max-w-4xl mx-auto w-full">
    <div class="flex justify-start">
      <div class="glass p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed border-l-4 border-indigo-500">
        👋 Hello! I am <strong>Suvyora AI</strong>. You can ask me questions or ask me to search the web for real-time information!
      </div>
    </div>
  </main>

  <!-- Input Area -->
  <footer class="p-4 max-w-4xl mx-auto w-full">
    <form id="chat-form" onsubmit="handleSend(event)" class="glass rounded-2xl p-2 flex items-center gap-2 border border-gray-800 focus-within:border-indigo-500 transition">
      <input type="text" id="user-input" placeholder="Ask Suvyora AI or search live info..." class="w-full bg-transparent px-4 py-2 outline-none text-sm text-white placeholder-gray-500" required />
      <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-xl transition flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
  </footer>

  <!-- Settings Modal for API Key -->
  <div id="settings-modal" class="fixed inset-0 bg-black/70 flex items-center justify-center hidden z-50 p-4">
    <div class="glass p-6 rounded-2xl max-w-md w-full border border-gray-800 space-y-4">
      <h2 class="text-lg font-semibold text-white">Suvyora AI Settings</h2>
      <p class="text-xs text-gray-400">Enter your free Google Gemini API Key to enable live web search responses.</p>
      <input type="password" id="api-key" placeholder="AIzaSy..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white outline-none focus:border-indigo-500" />
      <div class="flex justify-end gap-2">
        <button onclick="closeSettings()" class="px-4 py-2 text-xs text-gray-400 hover:text-white">Cancel</button>
        <button onclick="saveSettings()" class="px-4 py-2 text-xs bg-indigo-600 hover:bg-indigo-500 rounded-xl text-white font-medium">Save Key</button>
      </div>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('SUVYO_GEMINI_KEY') || '';

    function openSettings() { document.getElementById('settings-modal').classList.remove('hidden'); }
    function closeSettings() { document.getElementById('settings-modal').classList.add('hidden'); }
    function saveSettings() {
      apiKey = document.getElementById('api-key').value.trim();
      localStorage.setItem('SUVYO_GEMINI_KEY', apiKey);
      closeSettings();
    }

    if (!apiKey) openSettings();

    async function handleSend(e) {
      e.preventDefault();
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text);
      input.value = '';

      if (!apiKey) {
        appendMessage('bot', '⚠️ Please click the gear icon at the top right and enter your Gemini API Key first!');
        return;
      }

      const loadingId = appendMessage('bot', '🔍 Searching and thinking...');

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }],
            tools: [{ googleSearch: {} }] // Enables Live Web Search Grounding
          })
        });

        const data = await response.json();
        document.getElementById(loadingId).remove();

        if (data.candidates && data.candidates[0].content) {
          let botReply = data.candidates[0].content.parts[0].text;
          appendMessage('bot', botReply);
        } else {
          appendMessage('bot', 'Error: Unable to fetch response. Please check your API key.');
        }
      } catch (err) {
        document.getElementById(loadingId)?.remove();
        appendMessage('bot', 'Connection error. Check your internet or API key.');
      }
    }

    function appendMessage(sender, text) {
      const box = document.getElementById('chat-box');
      const div = document.createElement('div');
      const msgId = 'msg-' + Date.now();
      div.id = msgId;
      div.className = `flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;

      const inner = document.createElement('div');
      inner.className = sender === 'user'
        ? 'bg-indigo-600 text-white p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed'
        : 'glass p-4 rounded-2xl max-w-[85%] text-sm leading-relaxed border-l-4 border-indigo-500 whitespace-pre-line';
      inner.innerText = text;

      div.appendChild(inner);
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return msgId;
    }
  </script>
</body>
</html>
